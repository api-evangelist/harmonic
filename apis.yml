aid: harmonic
name: Harmonic
description: >-
  Harmonic is a Palo Alto AI lab building Mathematical Superintelligence (MSI) —
  AI that reasons with rigorous, verifiable logic rather than statistical pattern
  matching. Its flagship product, Aristotle, is a formal reasoning agent that
  uses Lean 4 to prove and formally verify graduate- and research-level problems
  in mathematics and software. Developers access Aristotle through the Aristotle
  API (https://aristotle.harmonic.fun) and the official Python SDK/CLI
  (aristotlelib): submit Lean 4 proof files with `sorry` placeholders, plain
  English math problems, or LaTeX research papers, and Aristotle attempts to
  complete, formalize, and formally verify them — running autonomously for up to
  24 hours on larger tasks and returning only formally checked results. Harmonic
  was co-founded by Vlad Tenev (co-founder of Robinhood) and Tudor Achim, and is
  backed by Kleiner Perkins.
