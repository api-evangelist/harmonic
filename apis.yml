apis:
- name: Aristotle API
  description: >-
    Programmatic access to Aristotle, Harmonic's formal reasoning agent. Over
    HTTPS with an API key, submit Lean 4 proofs with `sorry` placeholders,
    natural-language math problems, or LaTeX papers; Aristotle fills sorries,
    formalizes documents into Lean 4, and returns only formally verified results.
    The API is asynchronous — submit a job and poll/download the result — and is
    driven primarily through the official aristotlelib Python SDK and `aristotle`
    CLI.
